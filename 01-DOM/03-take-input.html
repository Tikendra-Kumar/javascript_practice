<!DOCTYPE html>
<html>  
    <body>
        <input id="name" type="text" placeholder="enter name"</input>    
        <button onclick="inputText()">Add name</button>
        <p id="output"></p>
        <script>
            function inputText(){
                 document.getElementById("output").innerText= document.getElementById("name").value;
                 const box=  document.getElementById("output").innerText
                  document.write(box)
                
        }
        </script></body>
</html>
